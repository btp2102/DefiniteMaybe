<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Definite Maybe</title>
<style>
  :root { --accent: #d4622a; --bg: #faf7f2; --card-bg: #ffffff; --text: #2a2420; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; }
  header { text-align: center; padding: 24px 16px 12px; }
  header h1 { font-size: 2.2em; margin: 0; color: var(--accent); }
  .intro-text { max-width: 700px; margin: 0 auto 20px; padding: 0 16px; line-height: 1.5; text-align: center; }
  #eventList { max-width: 800px; margin: 0 auto; padding: 0 16px 60px; }
  .event-card { background: var(--card-bg); border-radius: 10px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .add-event-btn { display: block; margin: 20px auto; background: var(--accent); color: white; border: none; padding: 14px 24px; border-radius: 24px; font-size: 1em; text-decoration: none; width: fit-content; }
  .tag-chip { display: inline-block; background: #fdeee4; color: var(--accent); padding: 2px 10px; border-radius: 12px; font-size: 0.8em; margin-right: 6px; }
</style>
</head>
<body>
<header><h1>Definite Maybe</h1></header>
<div class="intro-text" id="introText">Loading...</div>
<a class="add-event-btn" href="submit.html">+ Add Your Event</a>
<div id="eventList">Loading events...</div>

<script>
const API_BASE = 'YOUR_EXEC_URL_HERE';

fetch(API_BASE + '?api=config').then(r => r.json()).then(cfg => {
  document.getElementById('introText').textContent = cfg.IntroText || '';
});

fetch(API_BASE + '?api=events').then(r => r.json()).then(events => {
  const el = document.getElementById('eventList');
  if (!events || events.length === 0) { el.innerHTML = '<p>No events yet.</p>'; return; }
  el.innerHTML = events.map(ev => `
    <div class="event-card">
      <h3>${ev.title}</h3>
      <div>${ev.date} · ${ev.timeDisplay || ''} · ${ev.venue || ev.address || ''}</div>
      <div>${ev.description || ''}</div>
      <div>${(ev.tags||[]).map(t => `<span class="tag-chip">${t}</span>`).join('')}</div>
    </div>
  `).join('');
});
</script>
</body>
</html>
