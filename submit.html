<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add Your Event — Definite Maybe</title>
<style>
  body { font-family: -apple-system, Arial, sans-serif; background: #faf7f2; margin: 0; padding: 24px 16px; }
  .form-wrap { max-width: 500px; margin: 0 auto; background: white; border-radius: 12px; padding: 24px; }
  h1 { text-align: center; color: #d4622a; }
  label { display: block; margin-top: 14px; font-size: 0.9em; }
  input, textarea { width: 100%; padding: 10px; margin-top: 4px; border-radius: 6px; border: 1px solid #ccc; }
  button { margin-top: 20px; width: 100%; background: #d4622a; color: white; border: none; padding: 14px; border-radius: 24px; font-size: 1em; }
  #successMsg, #errorMsg { text-align: center; margin-top: 12px; display: none; }
  #successMsg { color: green; } #errorMsg { color: red; }

  .url-extract-box { background: #fdeee4; border-radius: 8px; padding: 14px; margin-bottom: 6px; }
  .url-extract-box label { margin-top: 0; }
  .url-extract-row { display: flex; gap: 8px; margin-top: 6px; }
  .url-extract-row input { flex: 1; margin-top: 0; }
  .url-extract-row button { margin-top: 0; width: auto; padding: 10px 16px; white-space: nowrap; }
  .url-extract-status { font-size: 0.85em; color: #a05a2c; margin-top: 6px; min-height: 1.2em; }
  .form-divider { text-align: center; color: #999; font-size: 0.85em; margin: 16px 0 4px; }
</style>
</head>
<body>
<div class="form-wrap">
  <h1>Add Your Event</h1>

  <div class="url-extract-box">
    <label>Have a link? Paste it to auto-fill the form</label>
    <div class="url-extract-row">
      <input type="url" id="urlExtractInput" placeholder="https://...">
      <button type="button" id="urlExtractBtn">Extract</button>
    </div>
    <div class="url-extract-status" id="urlExtractStatus"></div>
  </div>
  <div class="form-divider">— review and edit below, then submit —</div>

  <form id="eventForm">
    <label>Event Name *</label><input type="text" name="title" required>
    <label>Date *</label><input type="date" name="date" required>
    <label>Start Time *</label><input type="time" name="startTime" required>
    <label>End Time</label><input type="time" name="endTime">
    <label>Description *</label><textarea name="description" required></textarea>
    <label>Cost *</label><input type="text" name="price" required>
    <label>Address *</label><input type="text" name="address" required>
    <label>Venue Name</label><input type="text" name="venue">
    <label>More Info Link</label><input type="url" name="sourceLink">
    <label>Your Name *</label><input type="text" name="submittedBy" required>
    <label>Your Email *</label><input type="email" name="submitterEmail" required>
    <button type="submit">Submit Event</button>
  </form>
  <div id="successMsg">Thanks! Your event has been submitted.</div>
  <div id="errorMsg"></div>
  <a href="index.html">← Back</a>
</div>
<script>
const API_BASE = 'https://script.google.com/macros/s/AKfycbzxAcDnWOGeSvekDVOpi8lCOcp5mWD44O9ibQo-sifvJtQrVo6MIW-DEvwev5mKk4Uh/exec';

document.getElementById('urlExtractBtn').addEventListener('click', function() {
  const url = document.getElementById('urlExtractInput').value.trim();
  const statusEl = document.getElementById('urlExtractStatus');
  const btn = this;
  if (!url) { statusEl.textContent = 'Paste a link first.'; return; }

  statusEl.textContent = 'Reading the page…';
  btn.disabled = true;

  fetch(API_BASE, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ api: 'extractFromUrl', url: url })
  }).then(function(r) { return r.json(); }).then(function(res) {
    btn.disabled = false;
    if (!res.success) {
      statusEl.textContent = res.error || 'Could not extract details from that link.';
      return;
    }
    const ev = res.event || {};
    const form = document.getElementById('eventForm');
    if (ev.title) form.title.value = ev.title;
    if (ev.date) form.date.value = ev.date;
    if (ev.start_time) form.startTime.value = ev.start_time;
    if (ev.end_time) form.endTime.value = ev.end_time;
    if (ev.venue) form.venue.value = ev.venue;
    if (ev.address) form.address.value = ev.address;
    if (ev.price) form.price.value = ev.price;
    if (ev.description) form.description.value = ev.description;
    form.sourceLink.value = url;
    statusEl.textContent = '✓ Extracted — please check the fields below before submitting, some details may be missing or wrong.';
  }).catch(function() {
    btn.disabled = false;
    statusEl.textContent = 'Something went wrong reading that link.';
  });
});

document.getElementById('eventForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const params = Object.fromEntries(new FormData(e.target).entries());
  fetch(API_BASE, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ api: 'submitEvent', params })
  }).then(r => r.json()).then(res => {
    if (res.success) {
      document.getElementById('eventForm').style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    } else {
      document.getElementById('errorMsg').textContent = res.error || 'Submission failed.';
      document.getElementById('errorMsg').style.display = 'block';
    }
  });
});
</script>
</body>
</html>
