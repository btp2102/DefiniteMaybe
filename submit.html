<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add Your Event — Definite Maybe</title>
<style>
  body { font-family: -apple-system, Arial, sans-serif; background: #faf7f2; margin: 0; padding: 24px 16px; }
  .form-wrap { max-width: 500px; margin: 0 auto; background: white; border-radius: 12px; padding: 24px; }
  h1 { text-align: center; color: #d4622a; }
  label { display: block; margin-top: 14px; font-size: 0.9em; }
  input, textarea { width: 100%; padding: 10px; margin-top: 4px; border-radius: 6px; border: 1px solid #ccc; }
  button { margin-top: 20px; width: 100%; background: #d4622a; color: white; border: none; padding: 14px; border-radius: 24px; font-size: 1em; }
  #successMsg, #errorMsg { text-align: center; margin-top: 12px; display: none; }
  #successMsg { color: green; } #errorMsg { color: red; }
</style>
</head>
<body>
<div class="form-wrap">
  <h1>Add Your Event</h1>
  <form id="eventForm">
    <label>Event Name *</label><input type="text" name="title" required>
    <label>Date *</label><input type="date" name="date" required>
    <label>Start Time *</label><input type="time" name="startTime" required>
    <label>End Time</label><input type="time" name="endTime">
    <label>Description *</label><textarea name="description" required></textarea>
    <label>Cost *</label><input type="text" name="price" required>
    <label>Address *</label><input type="text" name="address" required>
    <label>Venue Name</label><input type="text" name="venue">
    <label>More Info Link</label><input type="url" name="sourceLink">
    <label>Your Name *</label><input type="text" name="submittedBy" required>
    <label>Your Email *</label><input type="email" name="submitterEmail" required>
    <button type="submit">Submit Event</button>
  </form>
  <div id="successMsg">Thanks! Your event has been submitted.</div>
  <div id="errorMsg"></div>
  <a href="index.html">← Back</a>
</div>
<script>
const API_BASE = 'https://script.google.com/macros/s/AKfycbzxAcDnWOGeSvekDVOpi8lCOcp5mWD44O9ibQo-sifvJtQrVo6MIW-DEvwev5mKk4Uh/exec';
document.getElementById('eventForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const params = Object.fromEntries(new FormData(e.target).entries());
  fetch(API_BASE, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ api: 'submitEvent', params })
  }).then(r => r.json()).then(res => {
    if (res.success) {
      document.getElementById('eventForm').style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    } else {
      document.getElementById('errorMsg').textContent = res.error || 'Submission failed.';
      document.getElementById('errorMsg').style.display = 'block';
    }
  });
});
</script>
</body>
</html>
