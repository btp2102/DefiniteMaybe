<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add Your Event — Definite Maybe</title>
<style>
  body { font-family: -apple-system, Arial, sans-serif; background: #faf7f2; margin: 0; padding: 24px 16px; }
  .form-wrap { max-width: 500px; margin: 0 auto; background: white; border-radius: 12px; padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  h1 { text-align: center; color: #d4622a; font-size: 1.6em; }
  label { display: block; margin-top: 14px; font-size: 0.9em; color: #555; }
  input, textarea { width: 100%; padding: 10px; margin-top: 4px; border-radius: 6px; border: 1px solid #ccc; font-family: inherit; font-size: 1em; }
  button { margin-top: 20px; width: 100%; background: #d4622a; color: white; border: none; padding: 14px; border-radius: 24px; font-size: 1em; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
  button:disabled { opacity: 0.75; cursor: not-allowed; }
  .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.4); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; display: none; }
  button.loading .spinner { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .back-link { display: block; text-align: center; margin-top: 16px; color: #888; }
  #successMsg { text-align: center; color: green; margin-top: 16px; display: none; }
  .hint { font-size: 0.8em; color: #999; margin-top: 2px; }
</style>
</head>
<body>
<div class="form-wrap">
  <h1>Add Your Event</h1>
  <form id="eventForm">
    <label>Event Name *</label>
    <input type="text" name="title" required>

    <label>Date *</label>
    <input type="date" name="date" required>

    <label>Start Time *</label>
    <input type="time" name="startTime" required>

    <label>End Time</label>
    <input type="time" name="endTime">

    <label>Description *</label>
    <textarea name="description" rows="3" required></textarea>

    <label>Cost *</label>
    <input type="text" name="price" placeholder="$free, $20, etc." required>

    <label>Address *</label>
    <input type="text" name="address" placeholder="Street address, NYC" required>
    <div class="hint">We'll figure out the borough and map location from this.</div>

    <label>Venue Name (optional)</label>
    <input type="text" name="venue" placeholder="e.g. Nowadays, Joe's Pub">

    <label>More Info / Ticket Link</label>
    <input type="url" name="sourceLink" placeholder="https://...">

    <label>Your Name *</label>
    <input type="text" name="submittedBy" required>

    <label>Your Email *</label>
    <input type="email" name="submitterEmail" required>

    <button type="submit" id="submitBtn">
      <span class="spinner"></span>
      <span id="submitBtnText">Submit Event</span>
    </button>
  </form>
  <div id="successMsg">Thanks! Your event has been submitted and will appear shortly.</div>
  <a class="back-link" href="index.html">← Back to calendar</a>
</div>

<script>
const API_BASE = 'https://script.google.com/macros/s/AKfycbzxAcDnWOGeSvekDVOpi8lCOcp5mWD44O9ibQo-sifvJtQrVo6MIW-DEvwev5mKk4Uh/exec';

document.getElementById('eventForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const params = Object.fromEntries(new FormData(e.target).entries());

  const btn = document.getElementById('submitBtn');
  const btnText = document.getElementById('submitBtnText');
  btn.disabled = true;
  btn.classList.add('loading');
  btnText.textContent = 'Submitting…';

  fetch(API_BASE, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ api: 'submitEvent', params: params })
  }).then(function() {
    document.getElementById('eventForm').style.display = 'none';
    document.getElementById('successMsg').style.display = 'block';
  }).catch(function() {
    btn.disabled = false;
    btn.classList.remove('loading');
    btnText.textContent = 'Submit Event';
    alert('Something went wrong — please try again.');
  });
});
</script>
</body>
</html>
